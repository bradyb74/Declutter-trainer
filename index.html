<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Calm - Decluttering Trainer</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useReducer } = React;
        const { Leaf, Target } = lucide;

        function DeclutterTrainer() {
          const challenges = [
            { area: 'Kitchen', task: 'Go through one kitchen drawer. Keep only what you actually use.', icon: '🍴' },
            { area: 'Bedroom', task: 'Pick one shelf or surface. Remove items you haven\'t touched in 2 years.', icon: '🛏️' },
            { area: 'Closet', task: 'Sort through 10 pieces of clothing. Ask: would my kids treasure this?', icon: '👕' },
            { area: 'Living Room', task: 'Clear one shelf, side table, or corner. Keep what brings calm.', icon: '🛋️' },
            { area: 'Bathroom', task: 'Declutter one medicine cabinet or drawer. Toss expired items.', icon: '🚿' },
            { area: 'Garage/Storage', task: 'Find one box or bin. Honestly assess what\'s really useful.', icon: '🔧' },
            { area: 'Papers & Desk', task: 'File or shred 15 pieces of paper. Let go of "someday" documents.', icon: '📄' },
            { area: 'Hallway/Entryway', task: 'Clear one area. Remove items blocking calm entry to your home.', icon: '🚪' },
            { area: 'Kids Room', task: 'Declutter toys/items they\'ve outgrown. Ask them first!', icon: '🧸' },
            { area: 'Any Area', task: 'Pick any space. Remove 5 items you don\'t need. That\'s enough!', icon: '✨' },
          ];

          const motivationalMessages = [
            "You're giving your children the gift of simplicity.",
            "Every item you remove creates space for peace.",
            "Your kids will remember the calm, not the clutter.",
            "This is an act of love—for your space and your family.",
            "Small steps, big impact. You've got this.",
            "Clearing clutter is clearing your mind.",
            "Future you will thank present you.",
            "Every single item counts. You're doing great!",
            "Your home reflects what you value. You're choosing peace.",
          ];

          const tips = [
            "🎯 Ask: 'Would my kids want this?' If no, it's okay to let it go.",
            "💭 Remember: Keeping something 'just in case' takes up mental space too.",
            "📦 Donate or sell. Someone else might treasure it—and you'll feel better.",
            "🚫 It's okay to feel guilty about waste. That's healthy. Learn and move on.",
            "⏰ 10 minutes is enough. Consistency matters more than marathon sessions.",
            "📸 Take before/after photos. You'll see the transformation!",
            "👥 Tell your kids what you're doing. They'll appreciate your effort.",
            "✨ One shelf cleared = a win. Celebrate it.",
          ];

          const initialState = {
            streak: 0,
            totalItemsRemoved: 0,
            sessions: [],
            lastSessionDate: null,
          };

          const reducer = (state, action) => {
            switch (action.type) {
              case 'LOG_SESSION':
                const today = new Date().toDateString();
                const isConsecutive = state.lastSessionDate === new Date(Date.now() - 86400000).toDateString();
                return {
                  ...state,
                  totalItemsRemoved: state.totalItemsRemoved + action.payload.itemsRemoved,
                  streak: state.lastSessionDate === today ? state.streak : (isConsecutive ? state.streak + 1 : 1),
                  sessions: [
                    ...state.sessions,
                    {
                      date: today,
                      area: action.payload.area,
                      itemsRemoved: action.payload.itemsRemoved,
                      note: action.payload.note,
                    },
                  ],
                  lastSessionDate: today,
                };
              default:
                return state;
            }
          };

          const [state, dispatch] = useReducer(reducer, initialState);
          const [itemsRemoved, setItemsRemoved] = useState('');
          const [sessionNote, setSessionNote] = useState('');
          const [showForm, setShowForm] = useState(false);
          const [selectedChallenge, setSelectedChallenge] = useState(challenges[0]);

          const today = new Date().toDateString();
          const alreadyLogged = state.sessions.some(s => s.date === today);

          const handleLogSession = () => {
            if (itemsRemoved && selectedChallenge) {
              dispatch({
                type: 'LOG_SESSION',
                payload: {
                  area: selectedChallenge.area,
                  itemsRemoved: parseInt(itemsRemoved),
                  note: sessionNote,
                },
              });
              setItemsRemoved('');
              setSessionNote('');
              setShowForm(false);
            }
          };

          const randomMessage = motivationalMessages[Math.floor(Math.random() * motivationalMessages.length)];
          const randomTip = tips[Math.floor(Math.random() * tips.length)];

          return (
            <div style={{ backgroundColor: '#F5F1E8', minHeight: '100vh', padding: '20px', fontFamily: 'system-ui, -apple-system, sans-serif' }}>
              <div style={{ maxWidth: '900px', margin: '0 auto' }}>
                <div style={{ textAlign: 'center', marginBottom: '40px' }}>
                  <h1 style={{ fontSize: '36px', color: '#8B7355', marginBottom: '10px', fontWeight: '300', letterSpacing: '-0.5px' }}>
                    Creating Calm
                  </h1>
                  <p style={{ fontSize: '16px', color: '#9B8B7E', fontStyle: 'italic', margin: '0' }}>
                    10 minutes a day to a lighter space. For you. For your family.
                  </p>
                </div>

                <div style={{
                  display: 'grid',
                  gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))',
                  gap: '15px',
                  marginBottom: '40px',
                }}>
                  <div style={{
                    backgroundColor: '#A8D5BA',
                    padding: '20px',
                    borderRadius: '8px',
                    textAlign: 'center',
                    color: 'white',
                  }}>
                    <div style={{ fontSize: '32px', fontWeight: 'bold' }}>{state.streak}</div>
                    <div style={{ fontSize: '12px', opacity: 0.9, marginTop: '5px', textTransform: 'uppercase', letterSpacing: '1px' }}>Days Strong</div>
                  </div>
                  <div style={{
                    backgroundColor: '#E8936C',
                    padding: '20px',
                    borderRadius: '8px',
                    textAlign: 'center',
                    color: 'white',
                  }}>
                    <div style={{ fontSize: '32px', fontWeight: 'bold' }}>{state.totalItemsRemoved}</div>
                    <div style={{ fontSize: '12px', opacity: 0.9, marginTop: '5px', textTransform: 'uppercase', letterSpacing: '1px' }}>Items Gone</div>
                  </div>
                  <div style={{
                    backgroundColor: '#C4A697',
                    padding: '20px',
                    borderRadius: '8px',
                    textAlign: 'center',
                    color: 'white',
                  }}>
                    <div style={{ fontSize: '32px', fontWeight: 'bold' }}>{state.sessions.length}</div>
                    <div style={{ fontSize: '12px', opacity: 0.9, marginTop: '5px', textTransform: 'uppercase', letterSpacing: '1px' }}>Sessions</div>
                  </div>
                </div>

                <div style={{
                  backgroundColor: '#A8D5BA',
                  padding: '20px',
                  borderRadius: '8px',
                  marginBottom: '30px',
                  borderLeft: '4px solid #8B7355',
                }}>
                  <p style={{ color: '#5A3E33', margin: '0', fontSize: '16px', fontWeight: '500' }}>
                    💚 {randomMessage}
                  </p>
                </div>

                <div style={{
                  backgroundColor: 'white',
                  padding: '30px',
                  borderRadius: '8px',
                  marginBottom: '30px',
                  boxShadow: '0 2px 8px rgba(139, 115, 85, 0.08)',
                }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '15px', marginBottom: '20px' }}>
                    <div style={{ fontSize: '40px' }}>{selectedChallenge.icon}</div>
                    <div>
                      <h2 style={{ margin: '0', color: '#8B7355', fontSize: '24px' }}>Today's 10-Minute Challenge</h2>
                      <p style={{ margin: '5px 0 0 0', color: '#9B8B7E', fontSize: '14px' }}>{selectedChallenge.area}</p>
                    </div>
                  </div>
                  <p style={{ color: '#5A3E33', fontSize: '16px', lineHeight: '1.6', margin: '20px 0' }}>
                    {selectedChallenge.task}
                  </p>

                  {alreadyLogged ? (
                    <div style={{
                      backgroundColor: '#F0F0E0',
                      padding: '15px',
                      borderRadius: '6px',
                      textAlign: 'center',
                      color: '#9B8B7E',
                    }}>
                      ✓ You've already logged today! Great job. Rest and repeat tomorrow.
                    </div>
                  ) : !showForm ? (
                    <button
                      onClick={() => setShowForm(true)}
                      style={{
                        backgroundColor: '#E8936C',
                        color: 'white',
                        border: 'none',
                        padding: '12px 24px',
                        borderRadius: '6px',
                        fontSize: '16px',
                        cursor: 'pointer',
                        fontWeight: '500',
                      }}
                    >
                      📋 Log Your Session
                    </button>
                  ) : (
                    <div style={{ marginTop: '20px' }}>
                      <div style={{ marginBottom: '15px' }}>
                        <label style={{ display: 'block', marginBottom: '8px', color: '#8B7355', fontWeight: '500' }}>
                          How many items did you remove?
                        </label>
                        <input
                          type="number"
                          value={itemsRemoved}
                          onChange={(e) => setItemsRemoved(e.target.value)}
                          placeholder="5"
                          style={{
                            width: '100%',
                            padding: '10px',
                            borderRadius: '6px',
                            border: '1px solid #D4C4B9',
                            fontSize: '16px',
                            boxSizing: 'border-box',
                          }}
                        />
                      </div>
                      <div style={{ marginBottom: '15px' }}>
                        <label style={{ display: 'block', marginBottom: '8px', color: '#8B7355', fontWeight: '500' }}>
                          How do you feel? (optional)
                        </label>
                        <textarea
                          value={sessionNote}
                          onChange={(e) => setSessionNote(e.target.value)}
                          placeholder="E.g., 'Felt good to let go of those old clothes'"
                          style={{
                            width: '100%',
                            padding: '10px',
                            borderRadius: '6px',
                            border: '1px solid #D4C4B9',
                            fontSize: '14px',
                            boxSizing: 'border-box',
                            fontFamily: 'inherit',
                            minHeight: '60px',
                            resize: 'vertical',
                          }}
                        />
                      </div>
                      <div style={{ display: 'flex', gap: '10px' }}>
                        <button
                          onClick={handleLogSession}
                          style={{
                            backgroundColor: '#A8D5BA',
                            color: 'white',
                            border: 'none',
                            padding: '12px 24px',
                            borderRadius: '6px',
                            fontSize: '16px',
                            cursor: 'pointer',
                            fontWeight: '500',
                          }}
                        >
                          Save & Celebrate
                        </button>
                        <button
                          onClick={() => setShowForm(false)}
                          style={{
                            backgroundColor: '#E8E0D4',
                            color: '#8B7355',
                            border: 'none',
                            padding: '12px 24px',
                            borderRadius: '6px',
                            fontSize: '16px',
                            cursor: 'pointer',
                          }}
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                <div style={{
                  backgroundColor: '#FFF9F0',
                  padding: '20px',
                  borderRadius: '8px',
                  marginBottom: '30px',
                  borderLeft: '4px solid #E8936C',
                }}>
                  <p style={{ color: '#5A3E33', margin: '0', fontSize: '15px' }}>
                    {randomTip}
                  </p>
                </div>

                {state.sessions.length > 0 && (
                  <div style={{ marginBottom: '30px' }}>
                    <h3 style={{ color: '#8B7355', fontSize: '18px', marginBottom: '15px' }}>Your Recent Sessions</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                      {state.sessions.slice().reverse().slice(0, 5).map((session, idx) => (
                        <div key={idx} style={{
                          backgroundColor: 'white',
                          padding: '15px',
                          borderRadius: '6px',
                          display: 'flex',
                          justifyContent: 'space-between',
                          alignItems: 'center',
                          boxShadow: '0 1px 4px rgba(139, 115, 85, 0.06)',
                        }}>
                          <div>
                            <div style={{ fontWeight: '500', color: '#8B7355' }}>{session.area}</div>
                            <div style={{ fontSize: '13px', color: '#9B8B7E', marginTop: '4px' }}>{session.date}</div>
                            {session.note && <div style={{ fontSize: '13px', color: '#C4A697', marginTop: '4px', fontStyle: 'italic' }}>"{session.note}"</div>}
                          </div>
                          <div style={{ backgroundColor: '#A8D5BA', color: 'white', padding: '8px 12px', borderRadius: '6px', fontWeight: '500' }}>
                            {session.itemsRemoved} items
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div style={{
                  backgroundColor: '#8B7355',
                  padding: '30px',
                  borderRadius: '8px',
                  textAlign: 'center',
                  color: 'white',
                }}>
                  <h3 style={{ margin: '0 0 10px 0', fontSize: '20px' }}>You've Got This</h3>
                  <p style={{ margin: '0', opacity: 0.9, lineHeight: '1.6' }}>
                    Every 10 minutes you spend decluttering is an investment in peace. Your space will reflect your values. Your kids will notice the calm.
                  </p>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<DeclutterTrainer />);
    </script>
</body>
</html>
